version: "2"

linters:
  default: standard
  enable:
    - misspell
  settings:
    misspell:
      locale: US
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: examples/
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports